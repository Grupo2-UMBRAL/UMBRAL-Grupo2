# UMBRAL login theme — inherits Keycloak's classic login theme (PatternFly/Bootstrap
# markup) and layers the UMBRAL brand palette on top via umbral.css.
# Palette source of truth: src/apps/mobile/src/theme/tokens.ts (bright Duolingo palette).
parent=keycloak
import=common/keycloak

# `styles` is an override, not an append: we re-list the base login.css so we keep the
# PatternFly layout, then load umbral.css last so our brand rules win the cascade.
styles=css/login.css css/umbral.css
