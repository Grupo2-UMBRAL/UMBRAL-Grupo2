name: Deploy Demo Container Apps

on:
  workflow_run:
    workflows:
      - Validation
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  DEMO_PUBLIC_BASE_URL: ${{ vars.DEMO_PUBLIC_BASE_URL }}
  IMAGE_TAG: "${{ github.event.workflow_run.head_sha || github.sha }}"
  KEYCLOAK_REALM: umbral
  KEYCLOAK_WEB_CLIENT_ID: umbral-web
  NEXT_PUBLIC_SESSION_OPERATIONS_HUB_PATH: /session-hub/hubs/session
  NEXT_PUBLIC_SCORING_MONITORING_HUB_PATH: /scoring-monitoring/hub/scoring
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

jobs:
  deploy:
    name: Build and deploy demo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment settings
        shell: pwsh
        run: |
          $requiredValues = @{
            AZURE_LOCATION = $env:AZURE_LOCATION
            AZURE_RESOURCE_GROUP = $env:AZURE_RESOURCE_GROUP
            AZURE_CONTAINER_APP_ENVIRONMENT = $env:AZURE_CONTAINER_APP_ENVIRONMENT
            AZURE_ACR_NAME = $env:AZURE_ACR_NAME
            DEMO_PUBLIC_BASE_URL = $env:DEMO_PUBLIC_BASE_URL
            DEMO_NEON_HOST = "${{ secrets.DEMO_NEON_HOST }}"
            DEMO_NEON_DATABASE = "${{ secrets.DEMO_NEON_DATABASE }}"
            DEMO_NEON_USER = "${{ secrets.DEMO_NEON_USER }}"
            DEMO_NEON_PASSWORD = "${{ secrets.DEMO_NEON_PASSWORD }}"
            DEMO_RABBITMQ_PASSWORD = "${{ secrets.DEMO_RABBITMQ_PASSWORD }}"
            DEMO_KEYCLOAK_ADMIN_PASSWORD = "${{ secrets.DEMO_KEYCLOAK_ADMIN_PASSWORD }}"
            DEMO_USER_MANAGEMENT_KEYCLOAK_ADMIN_PASSWORD = "${{ secrets.DEMO_USER_MANAGEMENT_KEYCLOAK_ADMIN_PASSWORD }}"
            DEMO_KEYCLOAK_SMTP_FROM_ADDRESS = "${{ secrets.DEMO_KEYCLOAK_SMTP_FROM_ADDRESS }}"
            DEMO_KEYCLOAK_SMTP_PASSWORD = "${{ secrets.DEMO_KEYCLOAK_SMTP_PASSWORD }}"
          }

          $missing = $requiredValues.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
            ForEach-Object { $_.Key }

          if ($missing) {
            throw "Missing deployment settings: $($missing -join ', ')"
          }

      - name: Compile Bicep
        shell: pwsh
        run: az bicep build --file deployment/azure/main.bicep

      - name: Ensure resource group
        shell: pwsh
        run: |
          az group create `
            --name "$env:AZURE_RESOURCE_GROUP" `
            --location "$env:AZURE_LOCATION" `
            --query properties.provisioningState

      - name: Bootstrap registry and shared infrastructure
        shell: pwsh
        run: |
          az deployment group create `
            --resource-group "$env:AZURE_RESOURCE_GROUP" `
            --template-file deployment/azure/main.bicep `
            --parameters `
              location="$env:AZURE_LOCATION" `
              resourcePrefix="umbral-demo" `
              containerAppsEnvironmentName="$env:AZURE_CONTAINER_APP_ENVIRONMENT" `
              containerRegistryName="$env:AZURE_ACR_NAME" `
              publicBaseUrl="$env:DEMO_PUBLIC_BASE_URL" `
              imageTag="$env:IMAGE_TAG" `
              deployContainerApps=false `
              postgresHost="${{ secrets.DEMO_NEON_HOST }}" `
              postgresDatabase="${{ secrets.DEMO_NEON_DATABASE }}" `
              postgresUser="${{ secrets.DEMO_NEON_USER }}" `
              postgresPassword="${{ secrets.DEMO_NEON_PASSWORD }}" `
              rabbitMqPassword="${{ secrets.DEMO_RABBITMQ_PASSWORD }}" `
              keycloakAdminPassword="${{ secrets.DEMO_KEYCLOAK_ADMIN_PASSWORD }}" `
              userManagementKeycloakAdminPassword="${{ secrets.DEMO_USER_MANAGEMENT_KEYCLOAK_ADMIN_PASSWORD }}" `
              keycloakSmtpFromAddress="${{ secrets.DEMO_KEYCLOAK_SMTP_FROM_ADDRESS }}" `
              keycloakSmtpPassword="${{ secrets.DEMO_KEYCLOAK_SMTP_PASSWORD }}"

      - name: Login to Azure Container Registry
        shell: pwsh
        run: az acr login --name "$env:AZURE_ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/keycloak.Dockerfile
          push: true
          build-args: |
            DEMO_PUBLIC_BASE_URL=${{ env.DEMO_PUBLIC_BASE_URL }}
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/keycloak:${{ env.IMAGE_TAG }}

      - name: Build and push User Management
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/docker/user-management.Dockerfile
          push: true
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/user-management:${{ env.IMAGE_TAG }}

      - name: Build and push Mission Management
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/docker/mission-management.Dockerfile
          push: true
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/mission-management:${{ env.IMAGE_TAG }}

      - name: Build and push Session Management
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/docker/session-management.Dockerfile
          push: true
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/session-management:${{ env.IMAGE_TAG }}

      - name: Build and push Scoring Monitoring
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/docker/scoring-monitoring.Dockerfile
          push: true
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/scoring-monitoring:${{ env.IMAGE_TAG }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/web.Dockerfile
          push: true
          build-args: |
            KEYCLOAK_REALM=${{ env.KEYCLOAK_REALM }}
            KEYCLOAK_WEB_CLIENT_ID=${{ env.KEYCLOAK_WEB_CLIENT_ID }}
            NEXT_PUBLIC_EDGE_PROXY_BASE_URL=${{ env.DEMO_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_KEYCLOAK_BASE_URL=${{ env.DEMO_PUBLIC_BASE_URL }}/auth
            NEXT_PUBLIC_SESSION_OPERATIONS_HUB_PATH=${{ env.NEXT_PUBLIC_SESSION_OPERATIONS_HUB_PATH }}
            NEXT_PUBLIC_SCORING_MONITORING_HUB_PATH=${{ env.NEXT_PUBLIC_SCORING_MONITORING_HUB_PATH }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/web:${{ env.IMAGE_TAG }}

      - name: Build and push Edge Proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/docker/edge-proxy.Dockerfile
          push: true
          tags: ${{ env.AZURE_ACR_NAME }}.azurecr.io/umbral/edge-proxy:${{ env.IMAGE_TAG }}

      - name: Deploy Container Apps
        shell: pwsh
        run: |
          az deployment group create `
            --resource-group "$env:AZURE_RESOURCE_GROUP" `
            --template-file deployment/azure/main.bicep `
            --parameters `
              location="$env:AZURE_LOCATION" `
              resourcePrefix="umbral-demo" `
              containerAppsEnvironmentName="$env:AZURE_CONTAINER_APP_ENVIRONMENT" `
              containerRegistryName="$env:AZURE_ACR_NAME" `
              publicBaseUrl="$env:DEMO_PUBLIC_BASE_URL" `
              imageTag="$env:IMAGE_TAG" `
              deployContainerApps=true `
              postgresHost="${{ secrets.DEMO_NEON_HOST }}" `
              postgresDatabase="${{ secrets.DEMO_NEON_DATABASE }}" `
              postgresUser="${{ secrets.DEMO_NEON_USER }}" `
              postgresPassword="${{ secrets.DEMO_NEON_PASSWORD }}" `
              rabbitMqPassword="${{ secrets.DEMO_RABBITMQ_PASSWORD }}" `
              keycloakAdminPassword="${{ secrets.DEMO_KEYCLOAK_ADMIN_PASSWORD }}" `
              userManagementKeycloakAdminPassword="${{ secrets.DEMO_USER_MANAGEMENT_KEYCLOAK_ADMIN_PASSWORD }}" `
              keycloakSmtpFromAddress="${{ secrets.DEMO_KEYCLOAK_SMTP_FROM_ADDRESS }}" `
              keycloakSmtpPassword="${{ secrets.DEMO_KEYCLOAK_SMTP_PASSWORD }}"

      - name: Health check public edge
        shell: pwsh
        run: |
          $healthUrl = "$env:DEMO_PUBLIC_BASE_URL/health"
          foreach ($attempt in 1..20) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                Write-Host "Edge health check passed."
                exit 0
              }
            }
            catch {
              Write-Host "Health check attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }
          throw "Edge health check did not pass: $healthUrl"
