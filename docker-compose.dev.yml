services:
  postgres:
    image: postgres:16-alpine
    container_name: umbral-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: umbral-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: umbral-keycloak
    command:
      - start-dev
      - --import-realm
      - --proxy=edge
      - --http-relative-path=/auth
      - --hostname=http://localhost:7500/auth
      - --hostname-backchannel-dynamic=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10


  mission-management-service:
    build:
      context: .
      dockerfile: infra/keycloak/docker/mission-management.Dockerfile
    container_name: umbral-mission-management-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=umbral;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=mission_management
      Auth__Authority: ${AUTH_AUTHORITY}
      Auth__RequireHttpsMetadata: ${AUTH_REQUIRE_HTTPS_METADATA}
      Auth__Audience: umbral-mission-management-api
      Persistence__ApplyMigrationsOnStartup: "true"
    ports:
      - "${MISSION_MANAGEMENT_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  session-management-service:
    build:
      context: .
      dockerfile: infra/keycloak/docker/session-management.Dockerfile
    container_name: umbral-session-management-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=umbral;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=session_operations
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      ScoringMonitoring__BaseUrl: http://scoring-monitoring-service:8080/
      Auth__Authority: ${AUTH_AUTHORITY}
      Auth__RequireHttpsMetadata: ${AUTH_REQUIRE_HTTPS_METADATA}
      Auth__Audience: umbral-session-management-api
      SignalR__Enabled: true
      Persistence__ApplyMigrationsOnStartup: "true"
    ports:
      - "${SESSION_OPERATIONS_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

  scoring-monitoring-service:
    build:
      context: .
      dockerfile: infra/keycloak/docker/scoring-monitoring.Dockerfile
    container_name: umbral-scoring-monitoring-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=umbral;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=scoring_ops
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Auth__Authority: ${AUTH_AUTHORITY}
      Auth__RequireHttpsMetadata: ${AUTH_REQUIRE_HTTPS_METADATA}
      Auth__Audience: umbral-scoring-monitoring-api
      Persistence__ApplyMigrationsOnStartup: "true"
    ports:
      - "${SCORING_MONITORING_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

  edge-proxy:
    build:
      context: .
      dockerfile: infra/keycloak/docker/edge-proxy.Dockerfile
    container_name: umbral-edge-proxy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      AllowedOrigins__0: http://localhost:5173
      AllowedOrigins__1: http://localhost:3000
      AllowedOrigins__2: http://localhost:${MOBILE_WEB_PORT}
      COVERAGE_REPORT_PATH: /app/coverage
      ReverseProxy__Clusters__identity-access__Destinations__primary__Address: http://identity-access-service:8080/
      ReverseProxy__Clusters__mission-management__Destinations__primary__Address: http://mission-management-service:8080/
      ReverseProxy__Clusters__session-management__Destinations__primary__Address: http://session-management-service:8080/
      ReverseProxy__Clusters__scoring-monitoring__Destinations__primary__Address: http://scoring-monitoring-service:8080/
      ReverseProxy__Clusters__keycloak__Destinations__primary__Address: http://keycloak:8080/
      ReverseProxy__Clusters__mobile__Destinations__primary__Address: http://mobile:19006/
      ReverseProxy__Clusters__web__Destinations__primary__Address: http://web:3000/
    ports:
      - "${EDGE_PROXY_PORT}:8080"
    volumes:
      - ./temp/validation/backend-coverage-report:/app/coverage
    depends_on:
      mission-management-service:
        condition: service_started
      session-management-service:
        condition: service_started
      scoring-monitoring-service:
        condition: service_started
      keycloak:
        condition: service_started

  web:
    build:
      context: ./src/apps/web
      dockerfile: Dockerfile
    container_name: umbral-web
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    environment:
      NODE_ENV: development
      PORT: ${WEB_PORT}
      WATCHPACK_POLLING: true
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID}
      EDGE_PROXY_INTERNAL_BASE_URL: ${EDGE_PROXY_INTERNAL_BASE_URL}
      KEYCLOAK_INTERNAL_BASE_URL: ${KEYCLOAK_INTERNAL_BASE_URL}
      NEXT_PUBLIC_EDGE_PROXY_BASE_URL: ${NEXT_PUBLIC_EDGE_PROXY_BASE_URL}
      NEXT_PUBLIC_KEYCLOAK_BASE_URL: ${NEXT_PUBLIC_KEYCLOAK_BASE_URL}
      NEXT_PUBLIC_SESSION_OPERATIONS_HUB_PATH: ${NEXT_PUBLIC_SESSION_OPERATIONS_HUB_PATH}
      NEXT_PUBLIC_SCORING_MONITORING_HUB_PATH: ${NEXT_PUBLIC_SCORING_MONITORING_HUB_PATH}
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ./src/apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      edge-proxy:
        condition: service_started

  mobile:
    image: node:22-alpine
    container_name: umbral-mobile
    working_dir: /app
    command:
      - /bin/sh
      - -lc
      - >
        npm install &&
        npm run web:compose
    environment:
      CI: "1"
      NODE_ENV: development
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      EXPO_NO_DEV_CLIENT: "1"
      EXPO_PORT: "${MOBILE_WEB_PORT}"
      EXPO_PUBLIC_EDGE_PROXY_BASE_URL: ${MOBILE_EDGE_PROXY_BASE_URL}
      EXPO_PUBLIC_KEYCLOAK_BASE_URL: ${MOBILE_KEYCLOAK_BASE_URL}
      EXPO_PUBLIC_KEYCLOAK_REALM: ${MOBILE_KEYCLOAK_REALM}
      EXPO_PUBLIC_KEYCLOAK_CLIENT_ID: ${MOBILE_KEYCLOAK_CLIENT_ID}
      EXPO_PUBLIC_SESSION_OPERATIONS_HUB_PATH: ${MOBILE_SESSION_OPERATIONS_HUB_PATH}
      EXPO_PUBLIC_SCORING_MONITORING_HUB_PATH: ${MOBILE_SCORING_MONITORING_HUB_PATH}
    ports:
      - "${MOBILE_WEB_PORT}:${MOBILE_WEB_PORT}"
    volumes:
      - ./src/apps/mobile:/app
      - mobile-node-modules:/app/node_modules
      - mobile-npm-cache:/root/.npm
    depends_on:
      edge-proxy:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  web-node-modules:
  mobile-node-modules:
  mobile-npm-cache:

